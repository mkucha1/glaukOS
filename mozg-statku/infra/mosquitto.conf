# Mosquitto — broker wiadomości statku (bez internetu)
persistence true
persistence_location /mosquitto/data/
autosave_interval 30
log_dest stdout
log_type error
log_type warning
log_type notice

# Sesje trwałe: telefon, który był w martwej strefie, po powrocie dostaje zaległe
# wiadomości QoS 1 (pytania zwrotne, zadania) — pod warunkiem clean=false i stałego clientId.
persistent_client_expiration 1d
max_queued_messages 1000

# Serwer, symulator czujników (TCP)
listener 1883
protocol mqtt

# PWA (MQTT.js) — przez Caddy jako wss://<serwer>/mqtt, ten sam certyfikat co strona
listener 9001
protocol websockets

# Demo: bez haseł. Produkcja: password_file + acl_file (konto per osoba i rola).
allow_anonymous true
