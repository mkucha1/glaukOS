# Szablony syntetycznych zgłoszeń — nastawione na CODZIENNE raporty (cel aplikacji: oszczędność czasu),
# z niewielkim udziałem usterek i zdarzeń. Groźne sytuacje (pożar, alarm ogólny) są poza aplikacją.
#
# Każdy szablon ma:
#   kategoria   — rutyna | usterka | zdarzenie (losowanie wg `udzialy` niżej)
#   gold        — poprawne odpowiedzi dla pytań z config/questions.yaml (NIE trafiają do pliku zgłoszenia)
#                 pilnosc: 1 rutynowe, 2 w najbliższych dniach / przy porcie, 3 dziś (wpływa na pracę lub wymaga reakcji)
#   miejsca     — pomieszczenia (metadane); z `miejsca_wg_slotu: true` lista jest równoległa do slotów
#   zglaszajacy — stanowiska osób, które realnie by to zgłosiły (z config/roster.yaml)
#   sloty       — wartości do {slot}; listy równoległe (jeden wspólny indeks), więc wersja pl i en mówią to samo
#   teksty      — warianty treści per język (jak po zamianie mowy na tekst)
# TODO: zastąpić/uzupełnić przykładami od prawdziwych oficerów.

udzialy: {rutyna: 0.80, usterka: 0.15, zdarzenie: 0.05}

templates:
  # ---------------------------------------------------------------- RUTYNA (pilność 1-2)
  - id: obchod_maszynowni
    kategoria: rutyna
    gold: {dzial: maszynownia, pilnosc: 1, raport_dpa: false, osoba: drugi_mechanik}
    miejsca: ["centrala maszynowni (ECR)"]
    zglaszajacy: ["motorzysta", "trzeci mechanik"]
    sloty:
      cisnienie: ["cztery i pół", "cztery i dwie dziesiąte", "pięć"]
      cisnienie_en: ["four point five", "four point two", "five"]
    teksty:
      pl:
        - "Obchód maszynowni zrobiony, wszystko w normie, ciśnienie oleju na silniku głównym {cisnienie} bara."
        - "Po obchodzie bez uwag, parametry silnika w normie."
      en: ["Engine room round done, all normal, main engine lube oil pressure {cisnienie_en} bar."]

  - id: pomiar_zbiornikow
    kategoria: rutyna
    gold: {dzial: maszynownia, pilnosc: 1, raport_dpa: false, osoba: starszy_mechanik}
    miejsca: ["maszynownia — poziom dolny", "centrala maszynowni (ECR)"]
    zglaszajacy: ["motorzysta", "trzeci mechanik"]
    sloty:
      nr: ["jeden", "dwa", "trzy"]
      nr_en: ["one", "two", "three"]
      ilosc: ["sto dwadzieścia", "osiemdziesiąt pięć", "sto czterdzieści"]
      ilosc_en: ["one hundred twenty", "eighty five", "one hundred forty"]
    teksty:
      pl: ["Pomiary zbiorników paliwa zrobione, w zbiorniku numer {nr} jest {ilosc} metrów sześciennych."]
      en: ["Fuel tank soundings done, tank number {nr_en} has {ilosc_en} cubic meters."]

  - id: zuzycie_wody
    kategoria: rutyna
    gold: {dzial: maszynownia, pilnosc: 1, raport_dpa: false, osoba: drugi_mechanik}
    miejsca: ["centrala maszynowni (ECR)"]
    zglaszajacy: ["trzeci mechanik", "motorzysta"]
    sloty:
      ile: ["osiem", "dziesięć", "dwanaście"]
      ile_en: ["eight", "ten", "twelve"]
    teksty:
      pl: ["Dzienne zużycie wody słodkiej {ile} ton, wyparownik pracuje normalnie."]
      en: ["Daily fresh water consumption {ile_en} tons, fresh water generator working normally."]

  - id: malowanie_skonczone
    kategoria: rutyna
    gold: {dzial: pokład, pilnosc: 1, raport_dpa: false, osoba: bosman}
    miejsca: ["pokład główny", "pokład łodziowy", "pokład dziobowy"]
    miejsca_wg_slotu: true
    zglaszajacy: ["marynarz AB", "marynarz OS"]
    sloty:
      gdzie: ["przy włazie numer trzy", "na pokładzie łodziowym", "na dziobie"]
      gdzie_en: ["around hatch number three", "on the boat deck", "on the forecastle"]
    teksty:
      pl: ["Skończyliśmy malowanie {gdzie}, sprzęt posprzątany."]
      en: ["Painting {gdzie_en} finished, tools cleaned and stored."]

  - id: farba_reling
    kategoria: rutyna
    gold: {dzial: pokład, pilnosc: 1, raport_dpa: false, osoba: bosman}
    miejsca: ["pokład główny", "pokład łodziowy"]
    zglaszajacy: ["marynarz AB", "marynarz OS"]
    sloty:
      gdzie: ["na relingu przy mostku", "na pokładzie łodziowym", "przy włazie numer trzy"]
      gdzie_en: ["on the railing near the bridge", "on the boat deck", "near hatch number three"]
    teksty:
      pl: ["Odchodzi farba i jest rdza {gdzie}, do pomalowania przy okazji."]
      en: ["Paint peeling and some rust {gdzie_en}, can be painted when we have time."]

  - id: przeglad_ratunkowy
    kategoria: rutyna
    gold: {dzial: pokład, pilnosc: 1, raport_dpa: false, osoba: starszy_oficer}
    miejsca: ["pokład łodziowy"]
    zglaszajacy: ["trzeci oficer", "marynarz AB"]
    sloty:
      sprzet: ["łodzi ratunkowej", "tratw ratunkowych", "kół ratunkowych"]
      sprzet_en: ["the lifeboat", "the liferafts", "the lifebuoys"]
    teksty:
      pl: ["Cotygodniowy przegląd {sprzet} zrobiony, wszystko sprawne, wpisane do dziennika."]
      en: ["Weekly inspection of {sprzet_en} done, everything in order, logged."]

  - id: przekazanie_wachty
    kategoria: rutyna
    gold: {dzial: pokład, pilnosc: 1, raport_dpa: false, osoba: starszy_oficer}
    miejsca: ["mostek"]
    zglaszajacy: ["drugi oficer", "trzeci oficer"]
    teksty:
      pl: ["Wachta przekazana, kurs i prędkość bez zmian, pogoda dobra, nic do zgłoszenia."]
      en: ["Watch handed over, course and speed unchanged, good weather, nothing to report."]

  - id: gniazdko_kabina
    kategoria: rutyna
    gold: {dzial: maszynownia, pilnosc: 1, raport_dpa: false, osoba: elektryk}
    miejsca: ["nadbudówka — kabiny załogi"]
    zglaszajacy: ["marynarz AB", "marynarz OS", "pomocnik kucharza"]
    sloty:
      nr: ["dwieście cztery", "trzysta dwanaście", "sto osiem"]
      nr_en: ["two zero four", "three one two", "one zero eight"]
    teksty:
      pl: ["W kabinie numer {nr} nie działa gniazdko przy biurku."]
      en: ["Power socket near the desk not working in cabin {nr_en}."]

  - id: lampa_korytarz
    kategoria: rutyna
    gold: {dzial: maszynownia, pilnosc: 1, raport_dpa: false, osoba: elektryk}
    miejsca: ["korytarz przy kabinach", "pralnia", "magazyn farb"]
    miejsca_wg_slotu: true
    zglaszajacy: ["marynarz OS", "marynarz AB", "pomocnik kucharza", "drugi oficer"]
    sloty:
      miejsce: ["korytarzu przy kabinach", "pralni", "magazynku farb"]
      miejsce_en: ["corridor near the cabins", "laundry", "paint store"]
    teksty:
      pl: ["W {miejsce} nie świeci jedna lampa."]
      en: ["Light not working in the {miejsce_en}, no rush."]

  - id: odpady_port
    kategoria: rutyna
    gold: {dzial: kuchnia, pilnosc: 2, raport_dpa: false, osoba: kucharz}
    miejsca: ["kuchnia", "magazyn odpadów"]
    zglaszajacy: ["starszy kucharz", "pomocnik kucharza"]
    teksty:
      pl: ["Magazyn odpadów prawie pełny, trzeba oddać śmieci w najbliższym porcie."]
      en: ["Garbage store almost full, we need to land the garbage at the next port."]

  - id: prowiant_planowo
    kategoria: rutyna
    gold: {dzial: kuchnia, pilnosc: 2, raport_dpa: false, osoba: kucharz}
    miejsca: ["magazyn prowiantowy", "kuchnia"]
    zglaszajacy: ["starszy kucharz"]
    sloty:
      produkt: ["mąka i ryż", "kawa i herbata", "świeże warzywa"]
      produkt_en: ["flour and rice", "coffee and tea", "fresh vegetables"]
    teksty:
      pl: ["{produkt} — zapas na mniej więcej dwa tygodnie, dopisuję do zamówienia na następny port."]
      en: ["{produkt_en} — about two weeks of stock left, adding to the order for the next port."]

  - id: ladownia_gotowa
    kategoria: rutyna
    gold: {dzial: pokład, pilnosc: 2, raport_dpa: false, osoba: starszy_oficer}
    miejsca: ["pokład główny — rejon ładowni"]
    zglaszajacy: ["bosman", "marynarz AB"]
    sloty:
      nr: ["jeden", "dwa", "cztery"]
      nr_en: ["one", "two", "four"]
    teksty:
      pl: ["Ładownia numer {nr} wyczyszczona i wysuszona, gotowa do inspekcji przed załadunkiem."]
      en: ["Hold number {nr_en} cleaned and dried, ready for inspection before loading."]

  # ---------------------------------------------------------------- USTERKI (pilność 2-3)
  - id: czesci_zamowienie
    kategoria: usterka
    gold: {dzial: maszynownia, pilnosc: 3, raport_dpa: false, osoba: starszy_mechanik}
    miejsca: ["warsztat maszynowy", "magazyn części"]
    zglaszajacy: ["drugi mechanik", "trzeci mechanik"]
    sloty:
      czesc: ["filtrów paliwa", "uszczelek do pompy chłodzenia", "pasków klinowych do sprężarki"]
      czesc_en: ["fuel filters", "seals for the cooling water pump", "V-belts for the compressor"]
    teksty:
      pl: ["Zużyliśmy ostatni komplet {czesc}, na statku nie ma już zapasu, trzeba pilnie zamówić."]
      en: ["We used the last set of {czesc_en}, no spares left on board, need to order urgently."]

  - id: prowiant_brak
    kategoria: usterka
    gold: {dzial: kuchnia, pilnosc: 3, raport_dpa: false, osoba: kucharz}
    miejsca: ["magazyn prowiantowy"]
    zglaszajacy: ["starszy kucharz"]
    sloty:
      produkt: ["mleka", "jajek", "chleba tostowego"]
      produkt_en: ["milk", "eggs", "toast bread"]
    teksty:
      pl: ["Kończą się zapasy {produkt}, starczy na dwa dni, a do portu mamy jeszcze tydzień."]
      en: ["Running out of {produkt_en}, enough for two days but the next port is a week away."]

  - id: chlodnia
    kategoria: usterka
    gold: {dzial: kuchnia, pilnosc: 3, raport_dpa: false, osoba: kucharz}
    miejsca: ["chłodnia prowiantowa"]
    zglaszajacy: ["starszy kucharz", "pomocnik kucharza"]
    sloty:
      temp: ["plus sześć", "plus osiem"]
      temp_en: ["plus six", "plus eight"]
    teksty:
      pl: ["W chłodni na mięso jest {temp} stopni, powinno być poniżej zera."]
      en: ["Meat freezer shows {temp_en} degrees, food will spoil."]

  - id: alarm_temp_silnik
    kategoria: usterka
    gold: {dzial: maszynownia, pilnosc: 3, raport_dpa: false, osoba: starszy_mechanik}
    miejsca: ["centrala maszynowni (ECR)"]
    zglaszajacy: ["trzeci mechanik", "drugi mechanik", "motorzysta"]
    sloty:
      cylinder: ["trzecim", "piątym", "szóstym"]
      cylinder_en: ["three", "five", "six"]
    teksty:
      pl: ["Temperatura spalin na {cylinder} cylindrze silnika głównego rośnie od pół godziny, trzeba sprawdzić."]
      en: ["Exhaust temperature on main engine cylinder {cylinder_en} rising for half an hour, needs checking."]

  - id: przetarta_lina
    kategoria: usterka
    gold: {dzial: pokład, pilnosc: 2, raport_dpa: false, osoba: bosman}
    miejsca: ["pokład rufowy", "pokład dziobowy"]
    miejsca_wg_slotu: true
    zglaszajacy: ["marynarz AB", "marynarz OS", "trzeci oficer"]
    sloty:
      gdzie: ["na rufie", "na dziobie"]
      gdzie_en: ["on the stern", "on the bow"]
    teksty:
      pl: ["Jedna lina cumownicza {gdzie} jest mocno przetarta, do wymiany przed następnym cumowaniem."]
      en: ["One mooring line {gdzie_en} is badly worn, should be replaced before the next berthing."]

  - id: wlaz_ladowni
    kategoria: usterka
    gold: {dzial: pokład, pilnosc: 3, raport_dpa: false, osoba: starszy_oficer}
    miejsca: ["pokład główny — rejon ładowni"]
    zglaszajacy: ["bosman", "drugi oficer", "marynarz AB"]
    sloty:
      nr: ["jeden", "dwa", "cztery"]
      nr_en: ["one", "two", "four"]
    teksty:
      pl: ["Pokrywa ładowni numer {nr} nie domyka się, przy tej fali może wejść woda do ładunku."]
      en: ["Hatch cover number {nr_en} does not close properly, with these waves water can get into the cargo."]

  # ---------------------------------------------------------------- ZDARZENIA (rzadkie; raport do DPA)
  - id: wyciek_poslizg
    kategoria: zdarzenie
    gold: {dzial: maszynownia, pilnosc: 3, raport_dpa: true, osoba: drugi_mechanik}
    miejsca: ["maszynownia — poziom dolny", "przedział pomp"]
    zglaszajacy: ["motorzysta", "trzeci mechanik"]
    sloty:
      urzadzenie: ["pompie balastowej numer dwa", "pompie zęzowej", "pompie chłodzenia"]
      urzadzenie_en: ["ballast pump number two", "bilge pump", "cooling water pump"]
    teksty:
      pl: ["Na {urzadzenie} cieknie uszczelka, pod spodem jest plama oleju, ktoś prawie się poślizgnął."]
      en: ["Oil leak at the {urzadzenie_en}, floor is slippery, one guy almost fell."]

  - id: oparzenie_kuchnia
    kategoria: zdarzenie
    gold: {dzial: kuchnia, pilnosc: 3, raport_dpa: true, osoba: kucharz}
    miejsca: ["kuchnia"]
    zglaszajacy: ["starszy kucharz"]
    sloty:
      co: ["olej z frytownicy", "wrzątek z kotła"]
      co_en: ["hot oil from the fryer", "boiling water from the kettle"]
    teksty:
      pl: ["Pomocnik kucharza oparzył rękę, prysnął {co}, opatrzony, ale trzeba zgłosić."]
      en: ["Messman burned his hand, {co_en} splashed, first aid given but we need to report it."]
