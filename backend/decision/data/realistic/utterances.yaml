# Realistyczne, "nieczyste" wypowiedzi załogi — tak, jak brzmiałyby po zamianie mowy na tekst.
#
# SKĄD: napisane ręcznie (przez Claude) na wzór prawdziwej mowy z transkrypcji nagrań mostka (VDR, NTSB —
# domena publiczna: wypełniacze, urwane zdania, powtórzenia, liczby słownie, krótkie fragmenty) oraz treści
# typowych raportów "work done" / list usterek. To NIE są nagrania prawdziwych marynarzy — do zastąpienia
# prawdziwymi wypowiedziami, gdy tylko je zdobędziemy.
#
# Pola:
#   tresc                — surowa wypowiedź (wejście dla modelu kompresującego i/lub Basala)
#   streszczenie_wzorcowe — jak powinna wyglądać po skompresowaniu (do oceny modelu kompresji)
#   gold                 — poprawne decyzje; zasada: dzial/osoba = KTO MUSI DZIAŁAĆ (naprawić, zamówić, zdecydować)
#   cechy                — co utrudnia wypowiedź (do analizy błędów)
#   uwagi                — gdzie etykieta jest dyskusyjna
#   niejednoznaczne: true — wypowiedź bez wystarczającej treści; poprawna reakcja aplikacji: dopytać
#
# Konwencja jak w transkrypcjach VDR: "*" = słowo niezrozumiałe dla rozpoznawania mowy.

wypowiedzi:
