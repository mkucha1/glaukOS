# Pytania zadawane modelowi decyzyjnemu do każdego zgłoszenia.
# Format zgodny z API Basala: POST /v1/systemone (choice / noul / score).
# Klucze w `criteria` muszą odpowiadać etykietom "gold" w generatorze.

questions:
  dzial:
    type: choice
    instructions: "Który dział na statku powinien zająć się tym zgłoszeniem?"
    criteria:
      pokład: "Dział pokładowy: kadłub, ładownie, cumowanie, dźwigi, sprzęt ratunkowy na pokładzie"
      maszynownia: "Dział maszynowy: silnik, pompy, generatory, instalacje, elektryka"
      kuchnia: "Dział hotelowy: kuchnia, prowiant, kabiny, pralnia"

  pilnosc:
    # Pilność decyduje o kolejności obsługi i wysyłki na ląd po złapaniu łącza.
    # Aplikacja jest do codziennych raportów; groźne zdarzenia obsługują alarmy i radio.
    type: score
    instructions: "Jak pilne jest to zgłoszenie dla codziennej pracy statku?"
    criteria:
      - "1 — rutynowe: informacja, pomiar, wykonana praca albo drobiazg do zrobienia przy okazji"
      - "2 — do załatwienia w najbliższych dniach albo przy następnym porcie"
      - "3 — pilne: wpływa na pracę statku albo wymaga reakcji jeszcze dziś (naprawa, zamówienie, braki)"

  raport_dpa:
    type: noul
    instructions: "Czy to zdarzenie jest wypadkiem lub sytuacją 'prawie wypadek', którą trzeba zgłosić do armatora (DPA)?"
    criteria:
      "true": "Tak — ktoś został lub mógł zostać ranny, albo było zagrożenie dla statku lub środowiska"
      "false": "Nie — zwykła usterka lub prośba bez zagrożenia"

  osoba:
    type: choice
    instructions: "Kto powinien przejąć to zadanie?"
    # Uzupełniane automatycznie z config/crew.yaml (wszystkie role).
    # TODO: w drugim kroku zawęzić listę do ról z działu wybranego w pytaniu `dzial`.
    criteria_from: crew

# Progi pewności: decyzja z pewnością >= próg idzie automatycznie, poniżej do oficera.
# pilnosc: 0.0 = zawsze automatycznie — błąd kosztuje tylko trochę późniejszą wysyłkę,
#          a zgłoszenia oznaczone jako raport do DPA i tak idą z najwyższym priorytetem (shipdec/queue.py).
# TODO: dobrać progi na osobnym zbiorze do kalibracji, sprawdzić na osobnym zbiorze testowym.
thresholds:
  default: 0.80
  raport_dpa: 0.90
  pilnosc: 0.0
