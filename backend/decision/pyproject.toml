[project]
name = "shipdec"
version = "0.1.0"
description = "Testy modelu decyzyjnego (Basal) na syntetycznych zgłoszeniach ze statku"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
shipdec = "shipdec.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
